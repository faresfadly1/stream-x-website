<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stream X Player</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; background: #080d12; color: #f5f7fa; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px clamp(18px, 5vw, 72px); border-bottom: 1px solid #27313d; }
        a { color: #21d4fd; text-decoration: none; font-weight: 700; }
        main { width: min(1200px, 92vw); margin: 38px auto; }
        .tag { display: inline-block; margin-bottom: 10px; color: #0f1820; background: #22d3ee; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
        h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 44px); }
        p { color: #b8c5d1; line-height: 1.55; }
        .player { margin-top: 22px; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px #0008; }
        video { display: block; width: 100%; max-height: 72vh; background: #000; }
        .error { padding: 28px; border: 1px solid #5c2934; background: #281319; border-radius: 12px; }
    </style>
</head>
<body>
    <header>
        <a href="movies.html">← Back to Movies</a>
        <a href="watchtogether.html">Watch Together</a>
    </header>
    <main>
        <span class="tag">FREE &amp; LEGAL · PUBLIC DOMAIN</span>
        <h1 id="title">Night of the Living Dead</h1>
        <p id="description">A full-length public-domain classic, played directly inside Stream X.</p>
        <div class="player" id="player"><video id="video" controls autoplay playsinline preload="metadata"></video></div>
    </main>
    <script>
        const movies = {
            'night-of-the-living-dead': {
                title: 'Night of the Living Dead',
                description: '1968 · Horror · Full public-domain movie',
                url: 'https://archive.org/download/night-of-the-living-dead_202409/Night%20Of%20The%20Living%20Dead.mp4'
            },
            'his-girl-friday': {
                title: 'His Girl Friday',
                description: '1940 · Comedy · Full public-domain movie',
                url: 'https://archive.org/download/HisGirlFriday1940/seqhisgirlfridayfull1d_512kb.mp4'
            },
            'the-general': {
                title: 'The General',
                description: '1926 · Comedy · Full public-domain movie',
                url: 'https://archive.org/download/the-general-1926_202506/The%20General%20%281926%29.mp4'
            }
        };
        const movie = movies[new URLSearchParams(location.search).get('movie')] || movies['night-of-the-living-dead'];
        document.title = `${movie.title} · Stream X`;
        document.getElementById('title').textContent = movie.title;
        document.getElementById('description').textContent = movie.description;
        const video = document.getElementById('video');
        video.src = movie.url;
        video.addEventListener('error', () => {
            document.getElementById('player').innerHTML = '<div class="error">This legal source is temporarily unavailable. Please try another free title from Movies.</div>';
        });
    </script>
</body>
</html>
