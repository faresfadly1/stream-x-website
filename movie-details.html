<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Details · Stream X</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; }
        body { margin: 0; background: #090d13; color: #fff; }
        a { color: #27d9b8; text-decoration: none; font-weight: 700; }
        header { padding: 18px clamp(18px, 6vw, 84px); display: flex; justify-content: space-between; border-bottom: 1px solid #26303d; }
        main { min-height: calc(100vh - 58px); }
        .hero { min-height: 420px; padding: 48px clamp(18px, 8vw, 120px); background-position: center; background-size: cover; position: relative; display: flex; align-items: end; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #090d13 8%, #090d13cc 43%, #090d1355), linear-gradient(0deg, #090d13, transparent 55%); }
        .intro { position: relative; max-width: 700px; }
        h1 { font-size: clamp(34px, 6vw, 64px); margin: 0 0 8px; }
        .meta, .chips { display: flex; flex-wrap: wrap; gap: 10px; color: #c5d0db; }
        .chip { background: #1c2632; padding: 7px 10px; border-radius: 99px; }
        .layout { display: grid; grid-template-columns: 190px minmax(0, 760px); gap: 34px; width: min(1120px, 90vw); margin: -24px auto 60px; position: relative; }
        .poster { width: 100%; border-radius: 14px; box-shadow: 0 14px 36px #0009; background: #17202b; }
        h2 { margin-top: 0; } p { color: #c5d0db; line-height: 1.65; }
        .trailer { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 14px; margin-top: 24px; }
        .legal-watch { margin: 28px 0; padding: 20px; border: 1px solid #235b43; border-radius: 14px; background: #0e211a; }
        .legal-watch h2 { margin-bottom: 8px; }
        .providers { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
        .provider { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: #172d24; color: #eaf7ef; font-size: 14px; }
        .provider img { width: 26px; height: 26px; object-fit: contain; border-radius: 6px; }
        .watch-legal { display: inline-block; margin-top: 6px; padding: 11px 15px; border-radius: 8px; background: #10c778; color: #04150d; font-weight: 800; text-decoration: none; }
        .attribution { margin: 12px 0 0; font-size: 12px; color: #9cb1a4; }
        .cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .person img, .avatar { width: 100%; aspect-ratio: 1; object-fit: cover; background: #1c2632; border-radius: 10px; }
        .person strong, .person span { display: block; margin-top: 6px; } .person span { color: #aebcca; font-size: 13px; }
        .notice { width: min(760px, 90vw); margin: 60px auto; padding: 22px; border: 1px solid #304154; border-radius: 12px; color: #c5d0db; }
        footer { padding: 28px; text-align: center; color: #91a1b1; font-size: 13px; }
        @media (max-width: 620px) { .layout { grid-template-columns: 1fr; margin-top: 24px; } .poster { max-width: 210px; } .hero { min-height: 360px; } }
    </style>
</head>
<body>
    <header><a href="movies.html">← Movies</a><a href="watchtogether.html">Watch Together</a></header>
    <main id="app"><div class="notice">Loading movie details…</div></main>
    <footer>This product uses the TMDB API but is not endorsed or certified by TMDB. <a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">The Movie Database</a></footer>
    <script>
        const SERVER_URL = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:3000' : 'https://stream-x-backend.onrender.com';
        const app = document.getElementById('app');
        const id = Number.parseInt(new URLSearchParams(location.search).get('tmdb'), 10);
        const escapeHtml = (text) => String(text || '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
        async function load() {
            if (!Number.isInteger(id) || id <= 0) throw new Error('Choose a movie from search first.');
            const response = await fetch(`${SERVER_URL}/api/tmdb/movie/${id}`);
            if (!response.ok) throw new Error('Movie details are temporarily unavailable.');
            const { movie } = await response.json();
            document.title = `${movie.title} · Stream X`;
            const cast = movie.cast.map((person) => `<article class="person">${person.image ? `<img src="${person.image}" alt="">` : '<div class="avatar"></div>'}<strong>${escapeHtml(person.name)}</strong><span>${escapeHtml(person.character)}</span></article>`).join('');
            const providers = (movie.providers || []).map((provider) => `<span class="provider">${provider.logo ? `<img src="${provider.logo}" alt="">` : ''}<span>${escapeHtml(provider.name)} · ${escapeHtml(provider.type)}</span></span>`).join('');
            const legalWatch = `<section class="legal-watch"><h2>Watch legally in Egypt</h2>${providers ? `<div class="providers">${providers}</div>` : '<p>No official streaming availability is currently listed for Egypt.</p>'}<a class="watch-legal" href="${escapeHtml(movie.availabilityLink)}" target="_blank" rel="noreferrer">Open legal viewing options</a><p class="attribution">Availability data by JustWatch.</p></section>`;
            app.innerHTML = `<section class="hero" style="background-image:url('${movie.backdrop}')"><div class="intro"><h1>${escapeHtml(movie.title)}</h1><div class="meta"><span>${escapeHtml(movie.year)}</span><span>${movie.runtime ? `${movie.runtime} min` : ''}</span><span>${movie.rating ? `★ ${movie.rating}/10` : ''}</span></div>${movie.tagline ? `<p><em>${escapeHtml(movie.tagline)}</em></p>` : ''}</div></section><section class="layout"><img class="poster" src="${movie.poster}" alt="${escapeHtml(movie.title)} poster"><div><div class="chips">${movie.genres.map((genre) => `<span class="chip">${escapeHtml(genre)}</span>`).join('')}</div><h2>Overview</h2><p>${escapeHtml(movie.overview)}</p><p><strong>Released:</strong> ${escapeHtml(movie.releaseDate || '—')} &nbsp; <strong>Countries:</strong> ${escapeHtml(movie.countries.join(', ') || '—')}</p>${legalWatch}<h2 style="margin-top:32px">Cast</h2><div class="cast">${cast || '<p>Cast information is unavailable.</p>'}</div></div></section>`;
        }
        load().catch((error) => { app.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`; });
    </script>
</body>
</html>
